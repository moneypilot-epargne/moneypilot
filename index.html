<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="MoneyPilot">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>MoneyPilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Mise en page : bureau = panneau noir arrondi sur fond indigo, barre d'onglets en haut, grille 2 colonnes.
   Mobile = écran noir, barre du bas avec bouton vert central. */
:root{
  --bg:#000; --panel:#07080c; --surface:#0f1116; --surface2:#171a22; --line:#1f2330;
  --text:#f3f5fa; --muted:#8b92a5; --accent:#2fd573; --accent-ink:#03150a;
  --violet:#8b5cf6; --blue:#4f7cff; --save:#34d3c0; --good:#2fd573; --warn:#f5b942; --bad:#ff5d6c;
  --font-display:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --radius:18px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:22px;font-weight:600} h3{font-size:15px;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--muted)} .small{font-size:12.5px} .neg{color:var(--bad)} .pos{color:var(--good)}
.only-d{display:none}
.shell{min-height:100%}
.topbar{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;padding:10px 14px;background:rgba(0,0,0,.92);backdrop-filter:blur(12px)}
.logo{display:flex;align-items:center;justify-content:center;gap:9px;font-weight:700;font-size:18px;font-family:var(--font-display)}
.logo i{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#1fa65a);display:grid;place-items:center;color:var(--accent-ink);font-style:normal;font-size:14px}
.logo b{color:var(--accent);font-weight:700}
.iconbtn{position:relative;width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--text)}
.iconbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
.badge[hidden]{display:none}
.topright{display:flex;gap:8px;justify-content:flex-end}
main{width:100%;max-width:1240px;margin:0 auto;padding:6px 14px calc(110px + env(safe-area-inset-bottom))}
.bottomnav{position:fixed;z-index:25;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;background:rgba(10,11,15,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
.bottomnav button{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:var(--muted);font-size:11px;font-weight:600;padding:4px 0}
.bottomnav button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bottomnav button[aria-current="page"]{color:var(--accent)}
.bottomnav .plus{width:54px;height:54px;border-radius:50%;background:var(--accent);color:var(--accent-ink);margin:-22px auto 0;box-shadow:0 8px 24px rgba(47,213,115,.35);justify-content:center}
.bottomnav .plus svg{stroke-width:2.6;width:26px;height:26px}
.view-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0 14px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);color:var(--text)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card.tight{padding:4px 14px}
.card.hero{background:radial-gradient(500px 220px at 90% 0%,rgba(139,92,246,.22),transparent 70%),var(--surface);border-color:#262a3a;padding:20px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.link{background:none;border:0;color:var(--muted);font-size:13px;font-weight:600;padding:4px 0}
.link:hover{color:var(--text)}
.label{font-size:13px;font-weight:500;color:var(--muted)}
.big{font-size:38px;font-weight:700;line-height:1.1;margin:6px 0 2px}
.mid{font-size:22px;font-weight:700;line-height:1.15;margin-top:4px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.bar{height:7px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:10px}
.bar>span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--violet),#b794ff);transition:width .6s ease}
.bar.save>span{background:linear-gradient(90deg,#1fa65a,var(--accent))} .bar.warn>span{background:var(--warn)} .bar.bad>span{background:var(--bad)} .bar.good>span{background:var(--good)}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px 16px;font-weight:600;font-size:14px;transition:transform .08s,background .15s}
.btn:hover{background:#20242f} .btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{background:#4be68a}
.btn.danger{color:var(--bad)} .btn.sm{padding:6px 11px;font-size:12.5px;border-radius:10px}
.btn.wide{width:100%;padding:15px;border-radius:16px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.alert.danger{border-color:rgba(255,93,108,.45);background:rgba(255,93,108,.09)}
.alert.warn{border-color:rgba(245,185,66,.4);background:rgba(245,185,66,.08)}
.alert.info{border-color:rgba(79,124,255,.4);background:rgba(79,124,255,.08)}
.dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none;background:var(--accent)}
.danger .dot{background:var(--bad)} .warn .dot{background:var(--warn)} .info .dot{background:var(--blue)}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.ico{width:38px;height:38px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;color:var(--accent)}
.item .t{font-weight:600;overflow-wrap:anywhere}
.amt{font-weight:700;white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);margin-right:4px}
.tag.prevu{color:var(--warn);border-color:rgba(245,185,66,.4)}
.tag.plaisir{color:#c4a4ff;border-color:rgba(196,164,255,.4)}
.tag.necessaire{color:var(--save);border-color:rgba(52,211,192,.4)}
.tag.imprevu{color:var(--bad);border-color:rgba(255,93,108,.4)}
.status{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:6px}
.status.ok{background:rgba(47,213,115,.16);color:var(--good)} .status.pending{background:rgba(245,185,66,.16);color:var(--warn)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.tabs button{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:8px 15px;font-weight:600;font-size:13px;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px;gap:2px}
.seg button{flex:1;background:none;border:0;border-radius:99px;padding:10px 8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg.sm{padding:3px}.seg.sm button{padding:6px 10px;font-size:12.5px}
.seg.sm button[aria-pressed="true"]{background:var(--surface2);color:var(--text)}
form .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
form label,.lbl{font-size:12.5px;font-weight:600;color:var(--muted)}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:44px}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--accent)}
textarea{min-height:140px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.check label{color:var(--text);font-size:14px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.modal[hidden]{display:none}
.sheet{width:100%;max-width:520px;max-height:92%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#eaffef;color:#03150a;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;max-width:90%;text-align:center;animation:up .2s ease}
.verdict{border-radius:var(--radius);padding:18px;border:1px solid;margin-bottom:12px}
.verdict .v{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1.15}
.verdict.good{background:rgba(47,213,115,.09);border-color:rgba(47,213,115,.45)} .verdict.good .v{color:var(--good)}
.verdict.warn{background:rgba(245,185,66,.09);border-color:rgba(245,185,66,.45)} .verdict.warn .v{color:var(--warn)}
.verdict.bad{background:rgba(255,93,108,.09);border-color:rgba(255,93,108,.45)} .verdict.bad .v{color:var(--bad)}
.reasons{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:8px}
.reasons li{display:flex;gap:10px;font-size:14px}
.empty{text-align:center;color:var(--muted);padding:22px 8px}
.finbanner{border-color:rgba(245,185,66,.5);background:linear-gradient(160deg,rgba(245,185,66,.12),rgba(255,93,108,.06))}
.scroll-x{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
/* accueil */
.home-grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
.kpis .kpi:first-child{grid-column:span 2}
.kpi{position:relative;overflow:hidden;padding:16px 16px 0;min-height:128px;display:flex;flex-direction:column}
.kpi .v{font-size:25px;font-weight:700;margin-top:6px}
.kpi:first-child .v{font-size:34px}
.kpi .d{font-size:12.5px;font-weight:700;margin-left:6px}
.kpi .sub{font-size:12px;color:var(--muted)}
.spark{display:block;width:calc(100% + 32px);height:46px;margin:auto -16px 0}
.kpi .bar{margin:auto 0 16px}
.minis{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}
.mini{padding:14px}
.mini .mid{font-size:19px}
.chartwrap{position:relative}
.chartwrap svg{display:block;width:100%;height:auto;overflow:visible}
.chartwrap text{fill:var(--muted);font-size:10.5px;font-family:var(--font-body)}
.tip{position:absolute;transform:translate(-50%,-125%);background:#0a0b10;border:1px solid #2a2f40;border-radius:12px;padding:8px 12px;font-size:12px;pointer-events:none;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.tip span{display:block;color:var(--muted)} .tip b{display:block;font-size:17px} .tip em{font-style:normal;color:var(--violet)}
.donut{position:relative;width:200px;max-width:100%;margin:6px auto 10px}
.donut svg{display:block;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 0 10px rgba(139,92,246,.45))}
.donut .mid-t{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:12px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.cat{display:flex;align-items:center;gap:12px;padding:10px 0}
.tile{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none}
.tile svg{width:20px;height:20px}
/* transactions */
.day span{display:inline-block}.day span::first-letter{text-transform:uppercase}.day{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px 8px;font-weight:600;font-size:14px}
.tx{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.tx:last-child{border-bottom:0}
.tx .txi{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
.tx .txi svg{width:20px;height:20px}
.tx .t{font-weight:600;overflow-wrap:anywhere}
.addbar{position:sticky;bottom:calc(92px + env(safe-area-inset-bottom));margin-top:16px}
@media (max-width:699px){.chartwrap text{font-size:17px}}
.alert.good{border-color:rgba(47,213,115,.4);background:rgba(47,213,115,.07)}.good .dot{background:var(--good)}
.stackbar{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--surface2);gap:2px}.stackbar span{display:block;height:100%}
.fx-row,.fx-head{display:grid;grid-template-columns:minmax(0,1fr) 84px 58px 38px;gap:8px;margin-bottom:8px;align-items:center}
.fx-head{margin-bottom:4px}
.onb-off .topright,.onb-off .only-m{visibility:hidden}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}.kpis .kpi:first-child{grid-column:auto}.kpi:first-child .v{font-size:25px}.minis{grid-template-columns:repeat(4,1fr)}}
@media (min-width:860px){
  body{background:radial-gradient(900px 600px at 15% 0%,#4a4fa8,transparent 60%),radial-gradient(900px 700px at 100% 100%,#2b1f5e,transparent 60%),#2a2a62;background-attachment:fixed;padding:28px}
  .only-m{display:none!important}.only-d{display:flex}
  .shell{max-width:1360px;margin:0 auto;background:var(--panel);border-radius:28px;padding:10px 26px 30px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .topbar{display:flex;gap:22px;background:transparent;backdrop-filter:none;padding:16px 0;position:static}
  .logo{justify-content:flex-start;font-size:19px}
  .toptabs{flex:1;gap:4px;overflow-x:auto;scrollbar-width:none}
  .toptabs button{flex:none;background:none;border:0;border-radius:11px;padding:10px 15px;color:var(--muted);font-weight:500;font-size:14.5px}
  .toptabs button:hover{color:var(--text)}
  .toptabs button[aria-current="page"]{background:#242630;color:var(--text);box-shadow:inset 0 0 0 1px #2e3140}
  main{padding:6px 0 0}
  .bottomnav{display:none}
  .home-grid{grid-template-columns:minmax(0,1fr) 340px;align-items:start}
  .addbar{bottom:20px}
  .toast{bottom:40px}
  .modal{align-items:center}.sheet{border-radius:22px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#auth{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
#auth[hidden]{display:none}
.authbox{width:100%;max-width:400px}
.authbox .logo{justify-content:flex-start;margin-bottom:22px}
.authbox .card{padding:22px}
.authbox .msg{margin-top:12px;font-size:13px;line-height:1.5}
.authbox .msg.err{color:var(--bad)} .authbox .msg.ok{color:var(--good)}
.authbox .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.authbox .row{align-items:stretch}.authbox .row .btn{flex:1;min-width:130px;min-height:46px}
.syncdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--muted)}
.syncdot.ok{background:var(--good)} .syncdot.err{background:var(--bad)} .syncdot.sync{background:var(--warn)}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <button class="iconbtn only-m" data-a="openMenu" aria-label="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
    <div class="logo"><i>M</i><span>Money<b>Pilot</b></span></div>
    <nav class="toptabs only-d" id="toptabs" aria-label="Navigation principale"></nav>
    <div class="topright"><button class="btn primary only-d" data-a="openExpense">+ Dépense</button><button class="iconbtn" data-a="openAlerts" aria-label="Alertes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="badge" id="bell-dot" hidden></span></button></div>
  </header>
  <main id="main" tabindex="-1"></main>
</div>
<nav class="bottomnav" id="bnav" aria-label="Navigation"></nav>
<div class="modal" id="modal" hidden><div class="sheet" role="dialog" aria-modal="true" id="sheet"></div></div>
<div id="toastbox" aria-live="polite"></div>

<script src="supabase.js"></script>
<script>
//#CORE-START
/* ===== Logique pure (dates, calculs, conseiller) ===== */
var CATS=['alimentation','essence','abonnements','loisirs','sorties','achats en ligne','santé','cadeaux','autres'];
var CAT_LABEL={alimentation:'Alimentation',essence:'Essence',abonnements:'Abonnements',loisirs:'Loisirs',sorties:'Sorties','achats en ligne':'Achats en ligne','santé':'Santé',cadeaux:'Cadeaux',autres:'Autres',epargne:'Épargne'};
var LOISIR_CATS=['loisirs','sorties','achats en ligne','cadeaux'];
var TYPES={necessaire:'Nécessaire',plaisir:'Plaisir',imprevu:'Imprévu'};
var p2=function(n){return String(n).padStart(2,'0')};
function ymd(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function todayStr(){return ymd(new Date())}
function parseD(s){var a=s.split('-').map(Number);return Date.UTC(a[0],a[1]-1,a[2])}
function fromUTC(t){var d=new Date(t);return d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate())}
function diffDays(a,b){return Math.round((parseD(b)-parseD(a))/86400000)}
function addDays(s,n){return fromUTC(parseD(s)+n*86400000)}
function addMonths(s,n){var a=s.split('-').map(Number);var first=new Date(Date.UTC(a[0],a[1]-1+n,1));var last=new Date(Date.UTC(first.getUTCFullYear(),first.getUTCMonth()+1,0)).getUTCDate();return first.getUTCFullYear()+'-'+p2(first.getUTCMonth()+1)+'-'+p2(Math.min(a[2],last))}
function r2(n){return Math.round((n+Number.EPSILON)*100)/100}
function sumM(a){return r2(a.reduce(function(t,e){return t+e.montant},0))}
function isLoisir(e){return LOISIR_CATS.indexOf(e.cat)>=0}

function dateWithDay(y,m,d){var last=new Date(Date.UTC(y,m+1,0)).getUTCDate();return y+'-'+p2(m+1)+'-'+p2(Math.min(d,last))}
function periodFor(today,jour){
  var a=today.split('-').map(Number),y=a[0],m=a[1]-1,c=dateWithDay(y,m,jour),debut,ny,nm;

   +'<div class="card"><h3>1. Mon revenu</h3><div class="two" style="margin-top:12px"><div class="field"><label for="p-rev">Montant par mois (€)</label><input id="p-rev" name="revenuMontant" inputmode="decimal" autocomplete="off" required value="'+v('revenuMontant')+'" placeholder="Ex. 635"></div><div class="field"><label for="p-jour">Jour du versement</label><input id="p-jour" name="revenuJour" inputmode="numeric" autocomplete="off" required value="'+(first?'':s.revenuJour)+'" placeholder="Ex. 5"></div></div><div class="field"><label for="p-solde">Solde actuel de mon compte (€)</label><input id="p-solde" name="soldeActuel" inputmode="decimal" autocomplete="off" value="'+solde+'" placeholder="Ce que tu as sur ton compte maintenant"><span class="small muted">Ce qu\'il y a sur ton compte courant maintenant. Si tu as déjà viré une partie vers un Coffre ou un livret, ne la compte pas ici.</span></div></div>'
   +'<div class="card"><h3>2. Mes charges fixes</h3><div class="small muted" style="margin:4px 0 12px">Ce qui est prélevé chaque mois : loyer, forfait, abonnements, assurance… Indique le jour du mois. Elles seront déduites automatiquement.</div><div class="fx-head small muted"><span>Nom</span><span>Montant</span><span>Jour</span><span></span></div><div id="fx-rows">'+rows+'</div><button type="button" class="btn sm" data-a="addFixe">+ Ajouter une charge</button></div>'
   +'<div class="card"><h3>3. Nourriture et loisirs</h3><div class="two" style="margin-top:12px"><div class="field"><label for="p-ali">Nourriture par mois (€)</label><input id="p-ali" name="budgetAlimentation" inputmode="decimal" autocomplete="off" required value="'+v('budgetAlimentation')+'" placeholder="Ex. 200"></div><div class="field"><label for="p-loi">Plafond loisirs (optionnel)</label><input id="p-loi" name="budgetLoisirs" inputmode="decimal" autocomplete="off" value="'+v('budgetLoisirs')+'" placeholder="Laisse vide si pas de plafond"></div></div><div class="field" style="margin-top:12px"><label for="p-ald">Nourriture déjà dépensée ce mois-ci (€, optionnel)</label><input id="p-ald" name="alimDeja" inputmode="decimal" autocomplete="off" value="'+(first||!s.alimDeja?'':String(s.alimDeja).replace('.',','))+'" placeholder="Laisse vide : estimé selon les jours déjà passés"></div><div class="small muted">La nourriture est toujours protégée : elle n\'est jamais considérée comme une dépense à couper. Si ton mois a déjà commencé, seul le reste à dépenser est réservé.</div></div>'
   +'<div class="card"><h3>4. Mon épargne</h3><div class="small muted" style="margin:4px 0 12px">Elle passe en premier : réservée dès le début du mois, avant tes dépenses plaisir.</div><div class="two"><div class="field"><label for="p-min">Minimum à mettre de côté (€)</label><input id="p-min" name="epargneProtegee" inputmode="decimal" autocomplete="off" required value="'+v('epargneProtegee')+'" placeholder="Ex. 150"></div><div class="field"><label for="p-ide">Idéal (€)</label><input id="p-ide" name="epargneIdeale" inputmode="decimal" autocomplete="off" value="'+v('epargneIdeale')+'" placeholder="Ex. 200"></div></div><div class="field"><label for="p-epd">Déjà mis de côté ce mois-ci (€)</label><input id="p-epd" name="epargneDeja" inputmode="decimal" autocomplete="off" value="'+(first||!s.epargneDeja?'':String(s.epargneDeja).replace('.',','))+'" placeholder="Ex. 80 si tu as déjà viré 80 € de côté"><span class="small muted">À remplir si ton mois a déjà commencé et que cet argent a déjà quitté ton compte courant (Coffre, livret). Il compte dans ton épargne du mois et n\'est pas retiré une deuxième fois.</span></div></div></div>'
   +'<div class="col"><div class="card" style="position:sticky;top:12px"><h3>Comment ton argent est réparti</h3><div id="plan-recap" style="margin-top:12px">'+recapHtml(p0)+'</div><button class="btn primary wide" style="margin-top:14px">'+(first?'Démarrer MoneyPilot':'Enregistrer mon plan')+'</button></div></div></div></form>';
}

/* --- Accueil --- */
function forecastCard(c){
  var st=state.settings,epObj=st.epargneIdeale>0?st.epargneIdeale:st.epargneProtegee;
  var h='<div class="card"><div class="card-h"><h3>Prévision de fin de mois</h3><span class="chip">'+c.jours+' j à tenir</span></div>';
  if(c.projReste===null){
    if((c.passes||0)<5){var left=Math.max(1,5-(c.passes||0));h+='<div class="small muted" style="line-height:1.6">Je regarde ton rythme de dépenses. Ma prévision sera plus fiable dans <b>'+left+' jour'+(left>1?'s':'')+'</b> : avec trop peu de jours, elle serait fausse.</div>'}
    else h+='<div class="small muted" style="line-height:1.6">Ton plan ne laisse pas d\'argent libre ce mois-ci : il n\'y a donc rien à prévoir. Chaque dépense plaisir mordrait sur ton épargne ou ta nourriture.</div>';
  }else{
    var sp=r2(0.2*Math.max(0,c.projDep||0)),lo=r2(c.projReste-sp),hi=r2(c.projReste+sp),fin=fdate(st.prochainRevenu);
    if(c.projReste>=0){
      h+='<div class="mid num" style="color:var(--good)">≈ '+eur(c.projReste)+'</div><div class="small" style="margin-top:6px;line-height:1.6">Au rythme actuel, il te restera environ <b>'+eur(c.projReste)+'</b> d\'argent libre au '+fin+' (entre '+eur(Math.max(0,lo))+' et '+eur(hi)+').';
      if(epObj>0&&c.virements<epObj&&c.projReste>0)h+=' Si tu le mets de côté, ton épargne du mois monterait à <b>'+eur(c.virements+c.projReste)+'</b>'+(c.virements+c.projReste>=epObj?', objectif atteint.':'.');
      h+='</div>';
    }else{
      var par=Math.ceil(-c.projReste/Math.max(1,c.jours));
      h+='<div class="mid num" style="color:var(--bad)">≈ '+eur(c.projReste)+'</div><div class="small" style="margin-top:6px;line-height:1.6">Au rythme actuel, tu dépasserais d\'environ <b>'+eur(-c.projReste)+'</b> au '+fin+', ce qui entamerait ton épargne. En dépensant environ <b>'+eur(par)+'</b> de moins par jour sur les '+c.jours+' jours restants, tu reviens dans le budget.</div>';
    }
  }
  return h+'<div class="small muted" style="margin-top:8px">Estimation : si tu fais mieux, tant mieux.</div></div>';
}
function vHome(c){
  var st=state.settings,t=todayStr(),S=series(c),h='',fm=state.finMois.actif,f=finDeMois(state,t,ui.useSavings);
  if(c.rollover)h+='<div class="card finbanner" style="margin-bottom:14px;border-color:rgba(47,213,115,.5);background:linear-gradient(160deg,rgba(47,213,115,.12),rgba(47,213,115,.03))"><div class="row between"><div class="grow"><b>Nouveau mois : ton revenu est tombé ?</b><div class="small muted">Je fais le bilan du mois qui se termine et je repars sur une nouvelle période.</div></div><button class="btn primary" data-a="openIncome">Démarrer le mois</button></div></div>';
  var lb=state.bilans[state.bilans.length-1];
  if(lb&&diffDays(st.debutPeriode,t)<=10)h+='<div class="card" style="margin-bottom:14px"><div class="row between"><div class="grow"><div class="label">Bilan du mois dernier</div><div class="mid num">Épargné : '+eur(lb.epargne)+' <span class="small" style="color:'+(lb.atteint?'var(--good)':'var(--warn)')+'">'+(lb.atteint?'objectif atteint':'objectif manqué')+'</span></div><div class="small muted">Dépensé '+eur(lb.depense)+' · '+fdate(lb.debut)+' → '+fdate(lb.fin)+'</div></div><button class="btn sm" data-a="crmGo" data-t="bilans">Voir les bilans</button></div></div>';
  if(fm)h+='<div class="card finbanner" style="margin-bottom:14px"><div class="row between"><div><div class="label">Mode fin de mois actif</div><div class="mid num">'+eur(f.totalJour)+' / jour max</div><div class="small muted">Dont '+eur(f.alimJour)+' protégés pour manger.</div></div><button class="btn" data-a="nav" data-v="finmois">Voir le plan</button></div></div>';
  else if(c.crise&&!c.rollover)h+='<div class="card finbanner" style="margin-bottom:14px"><div class="row between"><div class="grow"><b>Ton budget est très bas.</b><div class="small muted">Le mode fin de mois calcule ton plafond quotidien et protège ta nourriture.</div></div><button class="btn primary" data-a="toggleFin">Activer</button></div></div>';
  h+='<div class="view-title"><h2>Vue d\'ensemble</h2><span class="chip">'+fdate(st.debutPeriode)+' → '+fdate(st.prochainRevenu)+'</span></div>';
  var soldeSer=[st.soldeDebut].concat(S.cums.map(function(x){return r2(st.soldeDebut-x)}));
  var dj=c.budgetJour,djc=dj<st.seuilCrise?'var(--bad)':dj<st.seuilJour?'var(--warn)':'var(--good)';
  var epObj=st.epargneIdeale>0?st.epargneIdeale:st.epargneProtegee;
  var kpis='<div class="kpis">'
   +'<div class="card kpi"><div class="label">Argent libre aujourd\'hui</div><div class="v num" style="color:'+(c.disponible<0?'var(--bad)':'var(--text)')+'">'+eur(c.disponible)+'</div><button class="link" data-a="openCalc" style="text-align:left;font-size:12px;padding:0">Comment c\'est calculé ›</button>'+spark(soldeSer,c.disponible<0?'#ff5d6c':'#2fd573')+'</div>'
   +'<div class="card kpi"><div class="label">Dépensé ce mois</div><div class="v num">'+eur(c.totalPaye)+'</div><div class="sub">'+eur(sumM(c.planned))+' encore prévus</div>'+spark([0].concat(S.cums),'#ff5d6c')+'</div>'
   +'<div class="card kpi"><div class="label">Budget par jour</div><div class="v num" style="color:'+djc+'">'+eur(dj)+'</div><div class="sub">sur '+c.jours+' jour'+(c.jours>1?'s':'')+' restants</div>'+spark(S.daily.length>1?S.daily:[0,0],'#8b5cf6')+'</div>'
   +'<div class="card kpi"><div class="label">Épargne du mois</div><div class="v num" style="color:var(--save)">'+eur(c.virements)+'</div><div class="sub">minimum '+eur(st.epargneProtegee)+(st.epargneIdeale>st.epargneProtegee?' · idéal '+eur(st.epargneIdeale):'')+'</div>'+bar(epObj>0?c.virements/epObj:0,'save')+'</div></div>';
  var al=c.alerts.length?'<div class="alerts">'+c.alerts.map(function(a){return '<div class="alert '+a.l+'"><span class="dot"></span><span>'+esc(a.t)+'</span></div>'}).join('')+'</div>':'';
  var reste=Math.max(0,st.epargneProtegee-c.virements),ep='';
  if(st.epargneProtegee>0){
    var msg=c.virements>=st.epargneIdeale&&st.epargneIdeale>0?'Objectif idéal atteint ce mois-ci. Bravo.':c.virements>=st.epargneProtegee?'Minimum atteint. Il manque '+eur(Math.max(0,st.epargneIdeale-c.virements))+' pour l\'idéal.':'À mettre de côté dès le début du mois : il reste <b>'+eur(reste)+'</b> à virer. En attendant, cet argent est réservé et n\'apparaît pas dans ton argent libre.';
    var proj=c.projReste===null?'':c.projReste>=0?'<div class="small" style="margin-top:8px;color:var(--good)">Projection : au rythme actuel il te restera environ '+eur(c.projReste)+' d\'argent libre en fin de mois.</div>':'<div class="small" style="margin-top:8px;color:var(--bad)">Projection : au rythme actuel tu dépasseras de '+eur(-c.projReste)+', ce qui mordrait sur ton épargne.</div>';
    ep='<div class="card"><div class="card-h"><h3>Mon épargne du mois</h3><span class="chip">'+eur(c.virements)+' / '+eur(epObj)+'</span></div>'+bar(epObj>0?c.virements/epObj:0,'save')+'<div class="small muted" style="margin-top:10px">'+msg+'</div>'+proj+'<div class="row" style="margin-top:12px"><button class="btn primary sm" data-a="openEpargne">J\'ai mis de l\'argent de côté</button></div></div>';
  }
  var fixesPlan=state.fixes.reduce(function(a,x){return a+x.montant},0);
  var plan='<div class="card"><div class="card-h"><h3>Comment ton argent est réparti</h3><button class="link" data-a="nav" data-v="plan">Modifier ›</button></div>'+recapHtml({revenu:st.revenuMontant,min:st.epargneProtegee,ideal:st.epargneIdeale,alim:st.budgetAlimentation,fixes:state.fixes})+'</div>';
  var lr=st.budgetLoisirs>0?c.loisirReste/st.budgetLoisirs:0;
  var minis='<div class="minis"><div class="card mini"><div class="label">Prochain revenu</div><div class="mid num">'+c.jours+' j</div><div class="small muted">'+fdate(st.prochainRevenu)+'</div></div>'
   +(st.budgetLoisirs>0?'<div class="card mini"><div class="label">Plafond loisirs</div><div class="mid num" style="color:'+(c.loisirReste<0?'var(--bad)':'var(--text)')+'">'+eur(c.loisirReste)+'</div>'+bar(1-Math.max(0,lr),c.loisirReste<0?'bad':lr<0.2?'warn':'')+'</div>':'')
   +'<div class="card mini"><div class="label">Budget nourriture</div><div class="mid num">'+eur(c.resteAlim)+'</div>'+bar(st.budgetAlimentation>0?1-c.resteAlim/st.budgetAlimentation:0,'')+'</div>'
   +'<div class="card mini"><div class="label">Solde du compte</div><div class="mid num">'+eur(c.soldeReel)+'</div><button class="link" data-a="openSolde">Recaler ›</button></div></div>';
  var pl=c.planned.slice().sort(function(a,b){return a.date<b.date?-1:1}).slice(0,5);
  var rec=state.depenses.filter(function(e){return e.statut==='paye'&&e.cat!=='epargne'}).sort(function(a,b){return a.date<b.date?1:-1}).slice(0,5);
  var main='<div class="col">'+kpis+al+forecastCard(c)+'<div class="grid g2">'+(ep||'')+plan+'</div>'+minis
   +'<div class="card"><div class="card-h"><div><div class="label">Dépenses cumulées</div><div class="mid num">'+eur(c.totalPaye)+'</div></div><button class="link" data-a="nav" data-v="depenses">Tout voir ›</button></div>'+areaChart(c)+'</div>'
   +'<div class="grid g2"><div class="card"><div class="card-h"><h3>Dernières dépenses</h3><button class="link" data-a="nav" data-v="depenses">Tout voir ›</button></div>'+(rec.length?'<div class="list">'+rec.map(expRow).join('')+'</div>':'<div class="empty">Aucune dépense pour l\'instant. Appuie sur + pour en ajouter une.</div>')+'</div>'
   +'<div class="card"><div class="card-h"><h3>À venir avant le prochain revenu</h3><span class="chip">'+eur(sumM(c.planned))+'</span></div>'+(pl.length?'<div class="list">'+pl.map(expRow).join('')+'</div>':'<div class="empty">Rien de prévu.</div>')+'</div></div></div>';
  var goals='<div class="card"><div class="card-h"><h3>Objectifs d\'épargne</h3><button class="link" data-a="nav" data-v="objectifs">Gérer ›</button></div><div class="stack">'+(state.objectifs.length?state.objectifs.map(function(g){var p=g.cible>0?g.actuel/g.cible:0;return '<div class="cat" style="align-items:flex-start"><div class="tile" style="background:rgba(52,211,192,.16);color:var(--save)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="'+ICONS.obj+'"/></svg></div><div class="grow"><div class="row between"><b>'+esc(g.nom)+'</b><span class="small muted">'+Math.round(p*100)+' %</span></div><div class="small muted">'+eur(g.actuel)+' sur '+eur(g.cible)+'</div>'+bar(p,'')+'</div></div>'}).join(''):'<div class="empty">Aucun objectif. Crée-en un dans l\'onglet Objectifs.</div>')+'</div></div>';
  h+='<div class="home-grid">'+main+'<div class="col">'+donutCard(c)+goals+'</div></div>';
  return h;
}

/* --- Dépenses --- */
function expRow(e){
  return '<div class="tx" data-a="openExpense" data-id="'+e.id+'" role="button" tabindex="0">'+tile(e.cat,true)+'<div class="grow"><div class="t">'+esc(e.nom)+'</div><div class="small muted">'+CAT_LABEL[e.cat]+' · '+fdate(e.date)+(e.recurrent?' · récurrente':'')+'</div></div><div style="text-align:right"><div class="amt num neg">−'+eur(e.montant)+'</div>'+(e.statut==='prevu'?'<button class="btn sm" style="margin-top:4px" data-a="payExpense" data-id="'+e.id+'">Marquer payé</button>':'<span class="small muted">'+TYPES[e.type]+'</span>')+'</div></div>';
}
function filteredExp(){
  var f=ui.filter,q=f.q.trim().toLowerCase();
  return state.depenses.filter(function(e){return (!q||e.nom.toLowerCase().indexOf(q)>=0)&&(!f.cat||e.cat===f.cat)&&(!f.statut||e.statut===f.statut)&&(!f.mois||e.date.slice(0,7)===f.mois)}).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0});
}
function dayLabel(d){var t=todayStr();return d===t?'Aujourd\'hui':d===addDays(t,-1)?'Hier':d===addDays(t,1)?'Demain':new Date(parseD(d)).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'})}
function listHtml(){
  var l=filteredExp();if(!l.length)return '<div class="empty">Aucune dépense ne correspond.</div>';
  var groups=[],map={};l.forEach(function(e){if(!map[e.date]){map[e.date]={d:e.date,items:[]};groups.push(map[e.date])}map[e.date].items.push(e)});
  return '<div class="small muted" style="margin:10px 4px 0">'+l.length+' dépense'+(l.length>1?'s':'')+' · total '+eur(sumM(l))+'</div>'+groups.map(function(g){return '<div class="day"><span>'+dayLabel(g.d)+'</span><b class="neg num">−'+eur(sumM(g.items))+'</b></div><div class="card tight">'+g.items.map(expRow).join('')+'</div>'}).join('');
}
function vDepenses(){
  var mois={};state.depenses.forEach(function(e){mois[e.date.slice(0,7)]=1});
  var f=ui.filter;
  return '<div class="view-title"><h2>Dépenses</h2><button class="btn primary only-d" data-a="openExpense">+ Ajouter</button></div>'
   +'<div class="seg" role="group" aria-label="Statut">'+[['','Toutes'],['paye','Payées'],['prevu','Prévues']].map(function(x){return '<button data-a="seg" data-v="'+x[0]+'" aria-pressed="'+(f.statut===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>'
   +'<div class="grid g3" style="margin-top:12px"><input id="flt-q" placeholder="Rechercher…" value="'+esc(f.q)+'" aria-label="Rechercher"><select id="flt-cat" aria-label="Catégorie"><option value="">Toutes catégories</option>'+CATS.map(function(k){return '<option value="'+k+'"'+(f.cat===k?' selected':'')+'>'+CAT_LABEL[k]+'</option>'}).join('')+'</select><select id="flt-mois" aria-label="Mois"><option value="">Tous les mois</option>'+Object.keys(mois).sort().reverse().map(function(k){return '<option value="'+k+'"'+(f.mois===k?' selected':'')+'>'+fmois(k)+'</option>'}).join('')+'</select></div>'
   +'<div id="explist">'+listHtml()+'</div><div class="addbar"><button class="btn primary wide" data-a="openExpense">+ Ajouter une dépense</button></div>';
}

function expenseForm(e,pre){
  e=e||{};pre=pre||{};
  var v=function(k,d){return e[k]!==undefined?e[k]:pre[k]!==undefined?pre[k]:d};
  var names={};state.depenses.forEach(function(x){names[x.nom]=1});
  return '<h2 style="margin-bottom:14px">'+(e.id?'Modifier la dépense':'Nouvelle dépense')+'</h2><form data-f="expense"><input type="hidden" name="id" value="'+esc(e.id||'')+'">'
   +'<div class="field"><label for="x-m">Montant (€)</label><input id="x-m" name="montant" inputmode="decimal" required autocomplete="off" style="font-size:22px;font-weight:700" value="'+(v('montant','')===''?'':String(v('montant','')).replace('.',','))+'" placeholder="0,00"></div>'
   +'<div class="field"><label for="x-nom">Nom ou commerçant</label><input id="x-nom" name="nom" required maxlength="60" list="nomlist" autocomplete="off" value="'+esc(v('nom',''))+'" placeholder="Ex. Carrefour"><datalist id="nomlist">'+Object.keys(names).map(function(n){return '<option value="'+esc(n)+'">'}).join('')+'</datalist><span class="small muted">Si tu as déjà saisi ce nom, la catégorie se remplit toute seule.</span></div>'
   +'<div class="two"><div class="field"><label for="x-c">Catégorie</label><select id="x-c" name="cat">'+CATS.map(function(k){return '<option value="'+k+'"'+(v('cat','alimentation')===k?' selected':'')+'>'+CAT_LABEL[k]+'</option>'}).join('')+(v('cat','')==='epargne'?'<option value="epargne" selected>Épargne</option>':'')+'</select></div><div class="field"><label for="x-t">Type</label><select id="x-t" name="type">'+Object.keys(TYPES).map(function(k){return '<option value="'+k+'"'+(v('type','plaisir')===k?' selected':'')+'>'+TYPES[k]+'</option>'}).join('')+'</select></div></div>'
   +'<div class="two"><div class="field"><label for="x-d">Date</label><input id="x-d" type="date" name="date" required value="'+v('date',todayStr())+'"></div><div class="field"><label for="x-s">Statut</label><select id="x-s" name="statut"><option value="paye"'+(v('statut','paye')==='paye'?' selected':'')+'>Payé</option><option value="prevu"'+(v('statut','paye')==='prevu'?' selected':'')+'>Prévu</option></select></div></div>'
   +'<div class="check"><input type="checkbox" id="x-r" name="recurrent"'+(v('recurrent',false)?' checked':'')+'><label for="x-r">Dépense récurrente (chaque mois)</label></div>'
   +'<div class="row" style="justify-content:flex-end">'+(e.id?'<button type="button" class="btn danger" data-a="delExpense" data-id="'+e.id+'" style="margin-right:auto">Supprimer</button>'+(e.recurrent?'<button type="button" class="btn" data-a="repeatExpense" data-id="'+e.id+'">+1 mois</button>':''):'')+'<button type="button" class="btn" data-a="closeModal">Annuler</button><button class="btn primary" type="submit">Enregistrer</button></div></form>';
}


/* --- Conseiller --- */
function vConseiller(c){
  var a=ui.adv,r=a.res,h='<div class="view-title"><h2>Conseiller d\'achat</h2></div>';
  h+='<div class="grid g2"><div class="card"><form data-f="advisor"><div class="field"><label for="a-nom">Que veux-tu acheter ?</label><input id="a-nom" name="nom" required maxlength="60" value="'+esc(a.nom)+'" placeholder="Ex. Écran 27 pouces"></div><div class="two"><div class="field"><label for="a-prix">Prix (€)</label><input id="a-prix" name="prix" inputmode="decimal" required autocomplete="off" value="'+esc(a.prix)+'" placeholder="0,00"></div><div class="field"><label for="a-type">Nature</label><select id="a-type" name="type"><option value="plaisir"'+(a.type==='plaisir'?' selected':'')+'>Envie / plaisir</option><option value="necessaire"'+(a.type==='necessaire'?' selected':'')+'>Nécessaire</option></select></div></div><button class="btn primary" style="width:100%">Analyser cet achat</button></form>'
   +'<div class="small muted" style="margin-top:12px;line-height:1.6">Disponible réel : <b>'+eur(c.disponible)+'</b><br>Budget quotidien : <b>'+eur(c.budgetJour)+'</b> sur '+c.jours+' jours<br>Loisirs restant : <b>'+eur(c.loisirReste)+'</b></div></div>';
  if(r){
    var cls=r.verdict==='AUTORISE'?'good':r.verdict==='REPORTER'?'warn':'bad';
    var title=r.verdict==='AUTORISE'?'ACHAT AUTORISÉ':r.verdict==='REPORTER'?'ACHAT À REPORTER':'ACHAT DÉCONSEILLÉ';
    h+='<div><div class="verdict '+cls+'"><div class="label">'+esc(a.nom)+' · '+eur(parseNum(a.prix))+'</div><div class="v">'+title+'</div><ul class="reasons">'+r.reasons.map(function(x){return '<li><span class="dot" style="background:'+(x[0]==='ok'?'var(--good)':x[0]==='warn'?'var(--warn)':'var(--bad)')+'"></span><span>'+esc(x[1])+'</span></li>'}).join('')+'</ul></div>'
     +'<div class="card"><div class="label" style="margin-bottom:10px">Ta décision</div><div class="row"><button class="btn primary" data-a="advBuy">Je l\'achète</button><button class="btn" data-a="advRefuse">J\'y renonce</button><button class="btn" data-a="advWish">Mettre en réflexion</button></div><div class="small muted" style="margin-top:10px">Après achat : '+eur(r.apres)+' disponibles, '+eur(r.jourApres)+' par jour.</div></div></div>';
  }else h+='<div class="card empty">Saisis un achat envisagé pour obtenir un verdict clair, avec les raisons chiffrées.</div>';
  return h+'</div>';
}

/* --- Objectifs --- */
var GOAL_TYPES={securite:'Épargne de sécurité',projet:'Projet personnel',achat:'Achat futur',vacances:'Vacances'};
function vObjectifs(c){
  var t=todayStr(),tens=objectifsEnTension(state,t);
  var h='<div class="view-title"><h2>Objectifs d\'épargne</h2><button class="btn primary" data-a="openGoal">+ Nouvel objectif</button></div>';
  h+='<div class="card" style="margin-bottom:12px"><div class="label">Effort mensuel nécessaire</div><div class="mid num" style="color:'+(tens.tension?'var(--warn)':'var(--good)')+'">'+eur(tens.besoin)+' <span class="small muted">pour tout atteindre à temps · prévu : '+eur(tens.prevu)+'/mois</span></div>'+(tens.tension?'<div class="small" style="margin-top:6px;color:var(--warn)">Tes objectifs demandent plus que ton épargne prévue. Allonge une échéance ou augmente le montant mensuel (Réglages).</div>':'<div class="small muted" style="margin-top:6px">Ton rythme d\'épargne couvre tous tes objectifs.</div>')+'</div>';
  h+='<div class="grid g2">'+(state.objectifs.length?state.objectifs.map(function(g){
    var p=g.cible>0?g.actuel/g.cible:0,need=besoinGoal(g,t),over=g.date<t&&g.actuel<g.cible,done=g.actuel>=g.cible;
    return '<div class="card"><div class="row between"><div><div class="label">'+GOAL_TYPES[g.type]+'</div><h3 style="margin-top:2px;font-size:17px">'+esc(g.nom)+'</h3></div><span class="chip">'+Math.round(p*100)+' %</span></div><div class="mid num" style="margin-top:10px">'+eur(g.actuel)+'<span class="small muted"> / '+eur(g.cible)+'</span></div>'+bar(p,done?'good':'save')
     +'<div class="small muted" style="margin:8px 0 12px">'+(done?'Objectif atteint.':over?'Échéance dépassée ('+fdate(g.date)+') : il manque '+eur(g.cible-g.actuel)+'.':'Il manque '+eur(g.cible-g.actuel)+' d\'ici le '+fdate(g.date)+' soit '+eur(need)+'/mois.')+'</div><div class="row"><button class="btn sm primary" data-a="contribGoal" data-id="'+g.id+'">+ Verser</button><button class="btn sm" data-a="openGoal" data-id="'+g.id+'">Modifier</button><button class="btn sm danger" data-a="delGoal" data-id="'+g.id+'">Supprimer</button></div></div>'}).join(''):'<div class="card empty">Aucun objectif.</div>')+'</div>';
  return h;
}
function goalForm(g){
  g=g||{};
  return '<h2 style="margin-bottom:14px">'+(g.id?'Modifier l\'objectif':'Nouvel objectif')+'</h2><form data-f="goal"><input type="hidden" name="id" value="'+esc(g.id||'')+'"><div class="field"><label for="g-n">Nom</label><input id="g-n" name="nom" required maxlength="60" value="'+esc(g.nom||'')+'"></div><div class="field"><label for="g-t">Type</label><select id="g-t" name="type">'+Object.keys(GOAL_TYPES).map(function(k){return '<option value="'+k+'"'+((g.type||'projet')===k?' selected':'')+'>'+GOAL_TYPES[k]+'</option>'}).join('')+'</select></div><div class="two"><div class="field"><label for="g-c">Montant cible (€)</label><input id="g-c" name="cible" inputmode="decimal" required value="'+(g.cible!==undefined?String(g.cible).replace('.',','):'')+'"></div><div class="field"><label for="g-a">Déjà économisé (€)</label><input id="g-a" name="actuel" inputmode="decimal" required value="'+(g.actuel!==undefined?String(g.actuel).replace('.',','):'0')+'"></div></div><div class="field"><label for="g-d">Date limite</label><input id="g-d" type="date" name="date" required value="'+(g.date||addMonths(todayStr(),6))+'"></div><div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-a="closeModal">Annuler</button><button class="btn primary">Enregistrer</button></div></form>';
}

/* --- Envies --- */
var WSTAT={envie:'Envie',reflexion:'En réflexion',valide:'Validé',achete:'Acheté',abandonne:'Abandonné'};
var PRIO={haute:'Haute',moyenne:'Moyenne',basse:'Basse'};
function vEnvies(c){
  var t=todayStr();
  var act=state.envies.filter(function(w){return w.statut!=='achete'&&w.statut!=='abandonne'}),arch=state.envies.filter(function(w){return w.statut==='achete'||w.statut==='abandonne'});
  var po={haute:0,moyenne:1,basse:2};act.sort(function(a,b){return po[a.priorite]-po[b.priorite]});
  var h='<div class="view-title"><h2>Liste d\'envies</h2><button class="btn primary" data-a="openWish">+ Ajouter</button></div><div class="small muted" style="margin-bottom:12px">Plus l\'achat est cher, plus la période de réflexion est longue. Un achat ne peut être validé qu\'une fois ce délai écoulé.</div>';
  h+='<div class="grid g2">'+(act.length?act.map(function(w){return wishCard(w,t)}).join(''):'<div class="card empty">Ta liste est vide.</div>')+'</div>';
  if(arch.length)h+='<div class="card" style="margin-top:12px"><h3>Archivées</h3><div class="list">'+arch.map(function(w){return '<div class="item"><div class="grow"><div class="t">'+esc(w.nom)+'</div><div class="small muted">'+WSTAT[w.statut]+' · '+fdate(w.dateAjout)+'</div></div><div class="amt num">'+eur(w.prix)+'</div><button class="btn sm danger" data-a="delWish" data-id="'+w.id+'" aria-label="Supprimer">×</button></div>'}).join('')+'</div></div>';
  return h;
}
function wishCard(w,t){
  var d=delaiReflexion(w.prix),age=diffDays(w.dateAjout,t),left=Math.max(0,d-age),ready=left===0;
  return '<div class="card"><div class="row between"><span class="tag '+(w.priorite==='haute'?'imprevu':w.priorite==='moyenne'?'prevu':'')+'">Priorité '+PRIO[w.priorite].toLowerCase()+'</span><span class="chip">'+WSTAT[w.statut]+'</span></div><h3 style="font-size:17px;margin-top:8px">'+esc(w.nom)+'</h3><div class="mid num">'+eur(w.prix)+'</div><div class="small muted" style="margin:6px 0 4px">Ajouté le '+fdate(w.dateAjout)+' · réflexion recommandée : '+d+' j</div>'+bar(Math.min(1,age/d),ready?'good':'warn')
   +'<div class="small" style="margin:8px 0 12px;color:'+(ready?'var(--good)':'var(--warn)')+'">'+(ready?'Délai écoulé : tu peux décider.':'Encore '+left+' jour'+(left>1?'s':'')+' avant de pouvoir valider.')+'</div><div class="row">'
   +(w.statut==='envie'?'<button class="btn sm" data-a="wishStatus" data-id="'+w.id+'" data-s="reflexion">En réflexion</button>':'')
   +(w.statut!=='valide'?'<button class="btn sm" data-a="wishStatus" data-id="'+w.id+'" data-s="valide">Valider</button>':'')
   +'<button class="btn sm" data-a="wishAnalyse" data-id="'+w.id+'">Analyser</button>'
   +(w.statut==='valide'?'<button class="btn sm primary" data-a="wishBuy" data-id="'+w.id+'">Acheté</button>':'')
   +'<button class="btn sm" data-a="wishDrop" data-id="'+w.id+'">Abandonner</button><button class="btn sm" data-a="openWish" data-id="'+w.id+'">Modifier</button></div></div>';
}
function wishForm(w){
  w=w||{};
  return '<h2 style="margin-bottom:14px">'+(w.id?'Modifier l\'envie':'Nouvelle envie')+'</h2><form data-f="wish"><input type="hidden" name="id" value="'+esc(w.id||'')+'"><div class="field"><label for="w-n">Nom de l\'achat</label><input id="w-n" name="nom" required maxlength="60" value="'+esc(w.nom||'')+'"></div><div class="two"><div class="field"><label for="w-p">Prix (€)</label><input id="w-p" name="prix" inputmode="decimal" required value="'+(w.prix!==undefined?String(w.prix).replace('.',','):'')+'"></div><div class="field"><label for="w-r">Priorité</label><select id="w-r" name="priorite">'+Object.keys(PRIO).map(function(k){return '<option value="'+k+'"'+((w.priorite||'moyenne')===k?' selected':'')+'>'+PRIO[k]+'</option>'}).join('')+'</select></div></div><div class="two"><div class="field"><label for="w-s">Statut</label><select id="w-s" name="statut">'+Object.keys(WSTAT).map(function(k){return '<option value="'+k+'"'+((w.statut||'envie')===k?' selected':'')+'>'+WSTAT[k]+'</option>'}).join('')+'</select></div><div class="field"><label for="w-d">Date d\'ajout</label><input id="w-d" type="date" name="dateAjout" required value="'+(w.dateAjout||todayStr())+'"></div></div><div class="row" style="justify-content:flex-end"><button type="button" class="btn" data-a="closeModal">Annuler</button><button class="btn primary">Enregistrer</button></div></form>';
}

/* --- Suivi (CRM) --- */
function vCrm(c){
  var tabs=[['historique','Historique'],['achats','Achats'],['abos','Abonnements'],['rec','Récurrentes'],['refus','Refusés'],['stats','Statistiques'],['bilans','Bilans']];
  var h='<div class="view-title"><h2>Suivi financier</h2></div><div class="tabs" role="group" aria-label="Sections">'+tabs.map(function(t){return '<button data-a="crmTab" data-t="'+t[0]+'" aria-pressed="'+(ui.crmTab===t[0])+'">'+t[1]+'</button>'}).join('')+'</div>';
  var paid=state.depenses.filter(function(e){return e.statut==='paye'});
  var refus=state.decisions.filter(function(d){return d.suivi==='refuse'});
  var tr=sumM(refus);
  if(ui.crmTab==='historique'){
    var ev=paid.map(function(e){return {d:e.date,k:'dep',e:e}}).concat(state.decisions.map(function(d){return {d:d.date,k:'dec',e:d}})).sort(function(a,b){return a.d<b.d?1:-1}).slice(0,60);
    h+='<div class="card"><div class="list">'+ev.map(function(x){
      if(x.k==='dep')return '<div class="item"><div class="ico" style="color:'+CAT_COL[x.e.cat]+'">'+CAT_LABEL[x.e.cat].slice(0,2).toUpperCase()+'</div><div class="grow"><div class="t">'+esc(x.e.nom)+'</div><div class="small muted">'+fdate(x.d)+' · dépense · '+CAT_LABEL[x.e.cat]+'</div></div><div class="amt num">−'+eur(x.e.montant)+'</div></div>';
      var d=x.e;return '<div class="item"><div class="ico" style="color:'+(d.suivi==='refuse'?'var(--good)':'var(--warn)')+'">'+(d.suivi==='refuse'?'NON':'OUI')+'</div><div class="grow"><div class="t">'+esc(d.nom)+'</div><div class="small muted">'+fdate(d.date)+' · décision : '+(d.suivi==='refuse'?'refusé':'acheté')+' · verdict '+({AUTORISE:'autorisé',REPORTER:'à reporter',DECONSEILLE:'déconseillé'}[d.verdict]||'—')+'</div></div><div class="amt num" style="color:'+(d.suivi==='refuse'?'var(--good)':'var(--text)')+'">'+(d.suivi==='refuse'?'+':'')+eur(d.prix)+'</div></div>'}).join('')+'</div></div>';
  }else if(ui.crmTab==='achats'){
    var l=paid.filter(function(e){return !e.recurrent&&e.cat!=='alimentation'&&e.cat!=='essence'&&e.cat!=='abonnements'&&e.cat!=='epargne'}).sort(function(a,b){return a.date<b.date?1:-1});
    h+='<div class="card"><div class="row between"><h3>Achats ponctuels</h3><span class="chip">'+eur(sumM(l))+'</span></div><div class="list">'+(l.length?l.map(expRow).join(''):'<div class="empty">Aucun achat.</div>')+'</div></div>';
  }else if(ui.crmTab==='abos'||ui.crmTab==='rec'){
    var isA=ui.crmTab==='abos',map={};
    state.depenses.filter(function(e){return isA?e.cat==='abonnements':(e.recurrent&&e.cat!=='abonnements')}).forEach(function(e){var k=e.nom.toLowerCase();if(!map[k]||map[k].date<e.date)map[k]=e});
    var arr=Object.keys(map).map(function(k){return map[k]}).sort(function(a,b){return b.montant-a.montant}),m=sumM(arr);
    h+='<div class="card"><div class="row between"><div><div class="label">Coût mensuel</div><div class="mid num">'+eur(m)+'</div></div><div style="text-align:right"><div class="label">Sur 12 mois</div><div class="mid num">'+eur(m*12)+'</div></div></div><div class="list" style="margin-top:8px">'+(arr.length?arr.map(function(e){return '<div class="item"><div class="grow"><div class="t">'+esc(e.nom)+'</div><div class="small muted">Dernière échéance '+fdate(e.date)+' · <span class="tag '+e.type+'">'+TYPES[e.type]+'</span></div></div><div style="text-align:right"><div class="amt num">'+eur(e.montant)+'</div><div class="small muted">'+eur(e.montant*12)+'/an</div></div></div>'}).join(''):'<div class="empty">Rien ici. Coche « récurrente » sur une dépense.</div>')+'</div></div>';
  }else if(ui.crmTab==='refus'){
    h+='<div class="card hero" style="margin-bottom:12px"><div class="label">Argent économisé grâce aux achats refusés</div><div class="big num" style="color:var(--save)">'+eur(tr)+'</div><div class="small muted">'+refus.length+' achat'+(refus.length>1?'s':'')+' évité'+(refus.length>1?'s':'')+'</div></div><div class="card"><div class="list">'+(refus.length?refus.slice().sort(function(a,b){return a.date<b.date?1:-1}).map(function(d){return '<div class="item"><div class="grow"><div class="t">'+esc(d.nom)+'</div><div class="small muted">'+fdate(d.date)+'</div></div><div class="amt num" style="color:var(--save)">'+eur(d.prix)+'</div><button class="btn sm" data-a="toGoal" data-id="'+d.id+'">Mettre de côté</button></div>'}).join(''):'<div class="empty">Aucun achat refusé pour l\'instant.</div>')+'</div></div>';
  }else if(ui.crmTab==='bilans'){
    var bl=state.bilans.slice().reverse();
    h+=cumulCard();
    h+=bl.length?'<div class="stack">'+bl.map(function(b){return '<div class="card"><div class="row between"><h3>'+fdate(b.debut)+' → '+fdate(b.fin)+'</h3><span class="status '+(b.atteint?'ok':'pending')+'">'+(b.atteint?'Objectif atteint':'Objectif manqué')+'</span></div><div class="grid g3" style="margin-top:12px"><div><div class="label">Épargné</div><div class="mid num" style="color:var(--save)">'+eur(b.epargne)+'</div><div class="small muted">minimum '+eur(b.min)+'</div></div><div><div class="label">Dépensé</div><div class="mid num">'+eur(b.depense)+'</div></div><div><div class="label">Solde en fin de période</div><div class="mid num">'+eur(b.soldeFin)+'</div></div></div></div>'}).join('')+'</div>':'<div class="card empty">Aucun bilan pour l\'instant. Le premier arrive quand tu démarres ton deuxième mois.</div>';
  }else{
    var st=statsMensuelles(state);
    h+='<div class="card scroll-x"><table><thead><tr><th>Mois</th><th class="r">Dépensé</th><th class="r">Nécessaire</th><th class="r">Plaisir</th><th class="r">Imprévu</th><th class="r">Épargné</th><th class="r">Économisé (refus)</th></tr></thead><tbody>'+st.map(function(o){return '<tr><td>'+fmois(o.mois)+'</td><td class="r num"><b>'+eur(o.total)+'</b></td><td class="r num">'+eur(o.types.necessaire||0)+'</td><td class="r num">'+eur(o.types.plaisir||0)+'</td><td class="r num">'+eur(o.types.imprevu||0)+'</td><td class="r num" style="color:var(--save)">'+eur(o.refus)+'</td></tr>'}).join('')+'</tbody></table></div>';
    h+='<div class="grid g2" style="margin-top:12px">'+st.slice(0,2).map(function(o){var ks=Object.keys(o.cats).sort(function(a,b){return o.cats[b]-o.cats[a]});return '<div class="card"><h3 style="text-transform:capitalize">'+fmois(o.mois)+'</h3><div class="stack" style="margin-top:10px;gap:8px">'+ks.map(function(k){return '<div><div class="row between small"><span>'+CAT_LABEL[k]+'</span><b class="num">'+eur(o.cats[k])+'</b></div><div class="bar"><span style="width:'+pct(o.cats[k]/o.total)+'%;background:'+CAT_COL[k]+'"></span></div></div>'}).join('')+'</div></div>'}).join('')+'</div>';
  }
  return h;
}

/* --- Fin de mois --- */
function vFinMois(c){
  var f=finDeMois(state,todayStr(),ui.useSavings),on=state.finMois.actif;
  var h='<div class="view-title"><h2>Mode fin de mois</h2><button class="btn '+(on?'':'primary')+'" data-a="toggleFin">'+(on?'Désactiver le mode':'Activer le mode')+'</button></div>';
  h+='<div class="card '+(c.crise?'finbanner':'')+'" style="margin-bottom:12px"><b>'+(on?'Mode actif.':c.crise?'Ton budget est très bas : le mode est recommandé.':'Ton budget est confortable. Ce plan reste utile pour anticiper.')+'</b><div class="small muted">Ta nourriture est toujours protégée : elle n\'est jamais comptée comme une dépense à couper.</div></div>';
  h+='<div class="card hero"><div class="label">Plafond total par jour</div><div class="big num">'+eur(f.totalJour)+'</div><div class="small muted">pour '+c.jours+' jour'+(c.jours>1?'s':'')+' jusqu\'au '+fdate(state.settings.prochainRevenu)+'</div><div class="grid g2" style="margin-top:14px;gap:10px"><div><div class="label">Nourriture garantie</div><div class="mid num" style="color:var(--save)">'+eur(f.alimJour)+' <span class="small muted">/ jour</span></div></div><div><div class="label">Autres dépenses max</div><div class="mid num">'+eur(f.maxJour)+' <span class="small muted">/ jour</span></div></div></div></div>';
  if(!f.couvert)h+='<div class="alert danger" style="margin-top:12px"><span class="dot"></span><span><b>Même sans rien dépenser d\'autre, ton solde ne couvre pas tout ton budget nourriture.</b> Il manque '+eur(f.c.alimSortie-f.liquide)+'. Priorité : manger, puis chercher un revenu d\'appoint ou un report de paiement. Tu peux utiliser l\'épargne protégée en dernier recours.</span></div>';
  h+='<div class="card" style="margin-top:12px"><div class="check" style="margin:0"><input type="checkbox" id="use-sav" '+(ui.useSavings?'checked':'')+' data-a="useSav"><label for="use-sav">Utiliser l\'épargne protégée ('+eur(state.settings.epargneProtegee)+') en dernier recours</label></div></div>';
  h+='<div class="grid g2" style="margin-top:12px"><div class="card"><h3>À suspendre maintenant</h3><div class="small muted" style="margin:4px 0 8px">Dépenses non essentielles à geler jusqu\'au prochain revenu.</div>'
   +(f.suspendre.length?'<div class="list">'+f.suspendre.map(function(e){return '<div class="item"><div class="grow"><div class="t">'+esc(e.nom)+'</div><div class="small muted">'+fdate(e.date)+' · '+CAT_LABEL[e.cat]+'</div></div><div class="amt num">'+eur(e.montant)+'</div><button class="btn sm" data-a="delExpense" data-id="'+e.id+'">Retirer</button></div>'}).join('')+'</div><div class="small" style="margin-top:8px">Économie possible : <b>'+eur(f.economiePrevus)+'</b></div>':'<div class="empty">Aucune dépense prévue à suspendre.</div>')

/* --- Import de relevé (CSV Revolut) --- */
function parseCSV(t){
  t=t.replace(/^﻿/,'');var first=t.split(/\r?\n/)[0]||'',d=first.split(';').length>first.split(',').length?';':',';
  var rows=[],row=[],f='',q=false;
  for(var i=0;i<t.length;i++){var ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;
    else if(ch===d){row.push(f);f=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=ch;
  }
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(function(r){return r.some(function(x){return x.trim()!==''})});
}
function nrm(s){return String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim()}
function csvDate(s){var m=String(s).match(/(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+'-'+m[2]+'-'+m[3];m=String(s).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return m[3]+'-'+p2(+m[2])+'-'+p2(+m[1]);return null}
function csvNum(s){var x=String(s==null?'':s).replace(/[−–]/g,'-').replace(/[^\d,.\-]/g,'');if(x.indexOf(',')>=0&&x.indexOf('.')>=0)x=x.replace(/\./g,'').replace(',','.');else x=x.replace(',','.');var n=parseFloat(x);return isFinite(n)?n:NaN}
function guessCat(desc){
  var d=nrm(desc),T=function(r){return r.test(d)};
  if(T(/carrefour|lidl|auchan|leclerc|intermarche|monoprix|franprix|aldi|picard|biocoop|boulangerie|supermarche|grand frais|netto|\bcora\b|casino shop|vival|g20/))return 'alimentation';
  if(T(/totalenergies|\btotal\b|shell|esso|\bbp\b|avia|carburant|station/))return 'essence';
  if(T(/netflix|spotify|disney|canal\+|canal plus|prime video|apple\.com|icloud|youtube|deezer|abonnement|free mobile|\bsfr\b|orange|bouygues|forfait|navigo|basic.?fit|fitness|molotov|openai|google/))return 'abonnements';
  if(T(/cinema|\bugc\b|pathe|bowling|steam|playstation|\bpsn\b|nintendo|xbox|fnac|cultura|decathlon|jeu/))return 'loisirs';
  if(T(/restaurant|resto|mcdo|mcdonald|burger|kfc|uber eats|deliveroo|just eat|cafe|\bbar\b|pizza|sushi|starbucks|brasserie|bistro|kebab|tacos|subway|boulangerie/))return 'sorties';
  if(T(/amazon|aliexpress|shein|temu|vinted|ebay|cdiscount|zalando|paypal|asos/))return 'achats en ligne';
  if(T(/pharmacie|medecin|docteur|dentiste|opticien|hopital|mutuelle|laboratoire|doctolib|kine/))return 'santé';
  if(T(/cadeau|fleur|interflora/))return 'cadeaux';
  return 'autres';
}
function parseReleve(text){
  var R=parseCSV(text);if(R.length<2)return {error:'Fichier vide ou illisible.'};
  var H=R[0].map(nrm),ix=function(f){for(var i=0;i<H.length;i++)if(f(H[i]))return i;return -1};
  var iA=ix(function(h){return /^(amount|montant)$/.test(h)}),iD=ix(function(h){return /^(description|libelle)$/.test(h)});
  var iE=ix(function(h){return /date/.test(h)&&/(completed|fin|execution)/.test(h)}),iS=ix(function(h){return /date/.test(h)}),iT=ix(function(h){return /^(type)$/.test(h)});
  var iSt=ix(function(h){return /^(state|etat|statut)$/.test(h)}),iB=ix(function(h){return /^(balance|solde)$/.test(h)}),iF=ix(function(h){return /^(fee|frais)$/.test(h)});
  if(iA<0||iD<0||(iE<0&&iS<0))return {error:'Format non reconnu : il faut au moins les colonnes Date, Description et Montant (export de relevé Revolut en CSV).'};
  var rows=[],bal=null,balDate='';
  R.slice(1).forEach(function(r){
    var dt=csvDate(r[iE>=0&&r[iE]?iE:iS]||r[iS]||'');if(!dt)return;
    var stt=iSt>=0?nrm(r[iSt]):'completed';if(iSt>=0&&!/completed|termine|execute|effectue/.test(stt))return;
    if(iB>=0){var b=csvNum(r[iB]);if(isFinite(b)&&dt>=balDate){bal=b;balDate=dt}}
    var a=csvNum(r[iA]);if(!isFinite(a)||a>=0)return;
    var fee=iF>=0?csvNum(r[iF]):0,typ=iT>=0?nrm(r[iT]):'',nom=String(r[iD]||'').trim()||'Dépense';
    var m=r2(-a+(isFinite(fee)&&fee>0?fee:0)),cat=guessCat(nom);
    rows.push({date:dt,nom:nom.slice(0,60),montant:m,cat:cat,type:(cat==='alimentation'||cat==='essence'||cat==='santé')?'necessaire':'plaisir',raw:typ,checked:true,note:''});
  });
  var st=state.settings,used={};
  rows.forEach(function(r,i){
    if(state.depenses.some(function(e){return e.date===r.date&&Math.abs(e.montant-r.montant)<0.005&&nrm(e.nom)===nrm(r.nom)&&e.statut==='paye'})){r.checked=false;r.note='déjà importée';r.skip=true;return}
    var fx=state.depenses.find(function(e){return e.fixeId&&e.statut==='prevu'&&!used[e.id]&&e.date>=st.debutPeriode&&e.date<st.prochainRevenu&&Math.abs(e.montant-r.montant)<=1&&Math.abs(diffDays(e.date,r.date))<=4});
    if(fx){used[fx.id]=1;r.fx=fx.id;r.note='= charge fixe « '+fx.nom+' »';return}
    if(/transfer|virement/.test(r.raw)){r.checked=false;r.note='virement : coche si c\'est une vraie dépense'}
  });
  var g={};rows.forEach(function(r){var k=nrm(r.nom)+'|'+r.montant;(g[k]=g[k]||{})[r.date.slice(0,7)]=1});
  rows.forEach(function(r){var k=nrm(r.nom)+'|'+r.montant;r.rec=Object.keys(g[k]).length>=2});
  return {rows:rows.sort(function(a,b){return a.date<b.date?1:-1}),balance:bal};
}

  var P=ui.imp,sel=P.rows.filter(function(r){return r.checked&&!r.skip});
  var h='<h2 style="margin-bottom:6px">Relevé analysé</h2><p class="small muted" style="margin:0 0 10px">'+P.rows.length+' dépenses trouvées. Décoche ce que tu ne veux pas importer.</p><div style="max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:0 12px"><div class="list">'

}

function applyInbox(S,row,dateStr){
  var amt=r2(Number(row.amount)),mer=String(row.merchant||'Apple Pay').slice(0,80),id='ap_'+row.id;
  if(!(amt>0))return false;
  if(S.depenses.some(function(e){return e.id===id||e.apId===row.id}))return false;
  var m=null;
  S.depenses.forEach(function(e){if(!m&&e.statut==='prevu'&&Math.abs(e.montant-amt)<0.01&&Math.abs(diffDays(e.date,dateStr))<=3)m=e});
  if(m){m.statut='paye';m.apId=row.id;return true}
  var dup=S.depenses.some(function(e){return e.auto&&e.statut==='paye'&&!e.apId&&Math.abs(e.montant-amt)<0.01&&Math.abs(diffDays(e.date,dateStr))<=1});
  if(dup)return false;
  var cat=guessCat(mer);
  S.depenses.push({id:id,apId:row.id,nom:mer,montant:amt,cat:cat,date:dateStr,type:(cat==='alimentation'||cat==='essence'||cat==='santé')?'necessaire':'plaisir',statut:'paye',recurrent:false,source:'applepay'});
  return true;
}

function applePayCard(){
  if(!CLOUD.uid)return '';
  return '<div class="card"><h3>Paiements Apple Pay</h3><div class="small muted" style="margin:6px 0 12px;line-height:1.6">Chaque paiement Apple Pay s\'ajoute tout seul à tes dépenses. Tu reçois une notification seulement si tu t\'approches du rouge (ou pour te féliciter en fin de mois). Rien n\'est envoyé d\'autre que le montant et le nom du commerçant.</div><div class="row"><button class="btn primary" data-a="mkKey">'+(localStorage.getItem('mp.keyMade.'+CLOUD.uid)?'Changer ma clé secrète':'Activer et créer ma clé secrète')+'</button></div></div>';
}
function hex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(x){return ('0'+x.toString(16)).slice(-2)}).join('')}
A.mkKey=function(){
  var raw=new Uint8Array(32);crypto.getRandomValues(raw);var key='mp_'+hex(raw);
  crypto.subtle.digest('SHA-256',new TextEncoder().encode(key)).then(function(h){
    return CLOUD.client.from('moneypilot_tokens').upsert({user_id:CLOUD.uid,token_hash:hex(h)},{onConflict:'user_id'});
  }).then(function(r){
    if(r&&r.error){toast('Impossible de créer la clé');return}
    try{localStorage.setItem('mp.keyMade.'+CLOUD.uid,'1')}catch(e){}
    openModal('<h2 style="margin-bottom:10px">Ta clé secrète Apple Pay</h2><p class="small muted" style="margin:0 0 10px;line-height:1.6">Elle ne s\'affiche qu\'une seule fois : recopie-la maintenant dans le Raccourci de ton iPhone. Si tu la perds, crées-en une nouvelle (l\'ancienne cesse de marcher).</p><div class="field"><label>Clé secrète</label><textarea readonly id="k-key" rows="2" onclick="this.select()">'+key+'</textarea></div><div class="field"><label>Adresse (URL)</label><textarea readonly id="k-url" rows="2" onclick="this.select()">'+FNURL+'</textarea></div><div class="row" style="justify-content:flex-end"><button class="btn" data-a="closeModal">Fermer</button></div>');
    render();
  },function(){toast('Impossible de créer la clé')});
};
var FNURL='https://xjdcezrwauiojpkiwpwp.supabase.co/functions/v1/apple-pay';
function processInbox(){
  if(!CLOUD.uid||!CLOUD.readOk)return;
  CLOUD.client.from('moneypilot_inbox').select('id,amount,merchant,paid_at').eq('processed',false).order('paid_at',{ascending:true}).then(function(r){
    if(!r||r.error||!r.data||!r.data.length)return;
    var ch=false,ids=[];
    r.data.forEach(function(row){ids.push(row.id);if(applyInbox(state,row,ymd(new Date(row.paid_at))))ch=true});
    var fin=function(){CLOUD.client.from('moneypilot_inbox').delete().in('id',ids).then(function(){},function(){})};
    if(ch){save();render();toast(r.data.length+' paiement'+(r.data.length>1?'s':'')+' Apple Pay ajouté'+(r.data.length>1?'s':''));clearTimeout(CLOUD.timer);doPush().then(fin,fin)}else fin();
  },function(){});
}
function accountCard(){
  if(!CLOUD.uid)return '';
  return '<div class="card"><h3>Mon compte</h3><div class="small muted" style="margin:6px 0 10px;line-height:1.7">Connecté : <b>'+esc(CLOUD.email)+'</b><br><span class="syncdot '+(CLOUD.status||'')+'" id="syncdot"></span><span id="synclab">'+syncLabel()+'</span><br>Tes données sont les mêmes sur tous tes appareils, et personne d\'autre ne peut les lire.</div><div class="row"><button class="btn" data-a="logout">Se déconnecter</button></div></div>';
}
function doPush(){
  if(!CLOUD.client||!CLOUD.uid||!CLOUD.readOk)return Promise.resolve();
  CLOUD.timer=null;var snap=JSON.parse(JSON.stringify(state));
  return CLOUD.client.from('moneypilot_state').upsert({user_id:CLOUD.uid,data:snap,updated_at:new Date().toISOString()}).then(function(r){CLOUD.status=r&&r.error?'err':'ok';updateSync()},function(){CLOUD.status='err';updateSync()});
}
function pushCloud(){
  if(!CLOUD.uid||!CLOUD.readOk)return;
  clearTimeout(CLOUD.timer);CLOUD.status='sync';updateSync();CLOUD.timer=setTimeout(doPush,700);
}
function readLocal(){try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);if(valid(o))return o}}catch(e){}return null}
function pullCloud(){
  return CLOUD.client.from('moneypilot_state').select('data,updated_at').eq('user_id',CLOUD.uid).maybeSingle();
}
function authEl(){var a=document.getElementById('auth');if(!a){a=document.createElement('div');a.id='auth';document.body.appendChild(a)}return a}
function authMsg(t,cls){var m=document.getElementById('authmsg');if(m){m.className='msg '+(cls||'');m.textContent=t||''}}
function showAuth(note){
  CLOUD.uid=null;var a=authEl();a.hidden=false;
  a.innerHTML='<div class="authbox"><div class="logo"><i>M</i><span>Money<b>Pilot</b></span></div><div class="card"><h2>Connexion</h2><div class="small muted" style="margin:6px 0 14px;line-height:1.6">Ton espace est privé : tes chiffres sont rattachés à ton compte et synchronisés entre tes appareils.</div><form data-f="auth" autocomplete="on"><div class="field"><label for="au-e">E-mail</label><input id="au-e" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="au-p">Mot de passe (8 caractères minimum)</label><input id="au-p" name="password" type="password" autocomplete="current-password" minlength="8" required></div><div class="row"><button class="btn primary" type="submit">Se connecter</button><button class="btn" type="button" data-a="signup">Créer mon compte</button></div><div style="margin-top:12px"><button class="link" type="button" data-a="forgot">Mot de passe oublié ?</button></div></form><div id="authmsg" class="msg" role="status"></div></div></div>';
  if(note)authMsg(note,'ok');
}
function showNewPw(){
  var a=authEl();a.hidden=false;
  a.innerHTML='<div class="authbox"><div class="logo"><i>M</i><span>Money<b>Pilot</b></span></div><div class="card"><h2>Nouveau mot de passe</h2><form data-f="newpw"><div class="field"><label for="au-n">Nouveau mot de passe (8 caractères minimum)</label><input id="au-n" name="password" type="password" autocomplete="new-password" minlength="8" required></div><div class="row"><button class="btn primary" type="submit">Enregistrer</button></div></form><div id="authmsg" class="msg" role="status"></div></div></div>';
}
function authErr(e){
  var m=(e&&e.message)||'';
  if(/Invalid login/i.test(m))return 'E-mail ou mot de passe incorrect.';
  if(/not confirmed/i.test(m))return 'Ton e-mail n\'est pas encore confirmé. Ouvre le message de confirmation que je t\'ai envoyé.';
  if(/rate limit|too many/i.test(m))return 'Trop de tentatives. Réessaie dans quelques minutes.';
  if(/password/i.test(m)&&/6|8|short|weak/i.test(m))return 'Mot de passe trop court ou trop faible (8 caractères minimum).';
  return 'Une erreur est survenue : '+m;
}
function startUser(user){
  if(CLOUD.uid===user.id&&CLOUD.readOk)return;
  CLOUD.uid=user.id;CLOUD.email=user.email||'';KEY='moneypilot.v2.'+user.id;CLOUD.readOk=false;CLOUD.status='';
  var a=document.getElementById('auth');if(a)a.hidden=true;
  var loc=readLocal();
  pullCloud().then(function(r){
    if(r.error)throw r.error;
    var cl=r.data&&valid(r.data.data)?r.data.data:null,pick=null,pushIt=false;
    if(cl&&loc){if((loc._ts||0)>(cl._ts||0)){pick=loc;pushIt=true}else pick=cl}
    else if(cl)pick=cl;else if(loc){pick=loc;pushIt=true}
    CLOUD.readOk=true;
    state=normalize(pick||blank(),!!pick);
    ensureFixes();autoPay();
    cacheLocal();CLOUD.status='ok';
    render();
    if(pushIt)doPush();
    processInbox();
  }).catch(function(){
    if(loc){CLOUD.readOk=false;CLOUD.status='err';state=normalize(loc,true);ensureFixes();autoPay();render();toast('Hors ligne : tes données locales sont affichées')}
    else{var a2=authEl();a2.hidden=false;a2.innerHTML='<div class="authbox"><div class="card"><h2>Connexion impossible</h2><div class="small muted" style="margin:8px 0 14px">Je n\'arrive pas à joindre le serveur. Vérifie ta connexion internet.</div><button class="btn primary" data-a="retryBoot">Réessayer</button></div></div>'}
  });
}
function boot(){
  if(!window.supabase||!window.supabase.createClient){state=normalize(load());if(ensureFixes()|autoPay())save();save();render();return}
  CLOUD.client=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  CLOUD.client.auth.onAuthStateChange(function(ev,session){
    if(ev==='PASSWORD_RECOVERY'){CLOUD.recovery=true;showNewPw();return}
    if(ev==='SIGNED_OUT'){return}
    if((ev==='SIGNED_IN'||ev==='INITIAL_SESSION')&&session&&session.user&&!CLOUD.recovery){setTimeout(function(){startUser(session.user)},0)}
  });
  CLOUD.client.auth.getSession().then(function(r){var s=r.data&&r.data.session;if(!s&&!CLOUD.recovery&&!CLOUD.uid)showAuth()});
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState!=='visible'||!CLOUD.uid||!CLOUD.readOk||CLOUD.timer||!$('#modal').hidden)return;
    pullCloud().then(function(r){var cl=r.data&&valid(r.data.data)?r.data.data:null;if(cl&&(cl._ts||0)>(state._ts||0)){state=normalize(cl,true);ensureFixes();autoPay();cacheLocal();render()}processInbox()}).catch(function(){});
  });
}
A.signup=function(d,btn){
  var f=btn.form,em=f.elements.email.value.trim(),pw=f.elements.password.value;
  if(!em||pw.length<8){authMsg('Indique ton e-mail et un mot de passe de 8 caractères minimum.','err');return}
  authMsg('Création du compte…');
  CLOUD.client.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin+location.pathname}}).then(function(r){
    if(r.error){authMsg(authErr(r.error),'err');return}
    if(r.data&&r.data.session)return;
    authMsg('Compte créé. Ouvre l\'e-mail de confirmation que je viens de t\'envoyer, clique sur le lien, puis reviens te connecter ici.','ok');
  },function(){authMsg('Je n\'arrive pas à joindre le serveur.','err')});
};
A.forgot=function(d,btn){
  var em=btn.form.elements.email.value.trim();
  if(!em){authMsg('Écris d\'abord ton e-mail ci-dessus.','err');return}
  CLOUD.client.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname}).then(function(r){
    authMsg(r.error?authErr(r.error):'Si ce compte existe, un e-mail de réinitialisation vient de partir.',r.error?'err':'ok');
  });
};
F.auth=function(f){
  authMsg('Connexion…');
  CLOUD.client.auth.signInWithPassword({email:f.email.value.trim(),password:f.password.value}).then(function(r){
    if(r.error)authMsg(authErr(r.error),'err');
  },function(){authMsg('Je n\'arrive pas à joindre le serveur.','err')});
};
F.newpw=function(f){
  if(f.password.value.length<8){authMsg('8 caractères minimum.','err');return}
  CLOUD.client.auth.updateUser({password:f.password.value}).then(function(r){
    if(r.error){authMsg(authErr(r.error),'err');return}
    CLOUD.recovery=false;authMsg('Mot de passe changé.','ok');
    CLOUD.client.auth.getSession().then(function(s){if(s.data&&s.data.session)startUser(s.data.session.user);else showAuth()});
  });
};
A.logout=function(){
  var go=function(){
    try{localStorage.removeItem(KEY)}catch(e){}
    var c=CLOUD.client;CLOUD.uid=null;CLOUD.readOk=false;KEY='moneypilot.v2.local';state=blank();
    c.auth.signOut().then(function(){showAuth('Tu es déconnecté. Tes données restent dans ton compte.')},function(){showAuth()});
  };
  if(CLOUD.timer){clearTimeout(CLOUD.timer);doPush().then(go)}else go();
};
A.retryBoot=function(){location.reload()};

document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-a]');
  if(t&&A[t.dataset.a]){if(t.type!=='checkbox')ev.preventDefault();A[t.dataset.a](t.dataset,t);return}
  if(ev.target.id==='modal')closeModal();
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.matches&&t.matches('[data-a="useSav"]')){A.useSav(t.dataset,t);return}
  var m={'flt-cat':'cat','flt-statut':'statut','flt-mois':'mois'}[t.id];
  if(m){ui.filter[m]=t.value;$('#explist').innerHTML=listHtml()}
});
document.addEventListener('input',function(ev){if(ev.target.id==='flt-q'){ui.filter.q=ev.target.value;$('#explist').innerHTML=listHtml()}});
document.addEventListener('submit',function(ev){var f=ev.target;if(f.dataset&&f.dataset.f&&F[f.dataset.f]){ev.preventDefault();F[f.dataset.f](f.elements,f)}});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&!$('#modal').hidden)closeModal();if(ev.key==='Enter'&&ev.target.getAttribute&&ev.target.getAttribute('role')==='button'&&ev.target.dataset.a){ev.target.click()}});
document.addEventListener('change',function(ev){
  if(ev.target.id==='imp-f'&&ev.target.files[0]){var r=new FileReader();r.onload=function(){$('#imp-t').value=r.result};r.readAsText(ev.target.files[0])}
});

boot();
</script>
